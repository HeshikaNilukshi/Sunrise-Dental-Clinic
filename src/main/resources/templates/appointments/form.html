<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_layout :: main('Book Appointment', 'appointments', ~{::content})}">
<head>
    <title>Book Appointment</title>
</head>
<body>
<div th:fragment="content" class="max-w-2xl mx-auto space-y-6">

    <!-- Page Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-xl md:text-2xl font-bold text-slate-900">Schedule Patient Appointment</h1>
            <p class="text-xs text-slate-500 mt-1">Assign a patient to an active dentist, treatment procedure, and time slot</p>
        </div>
        <a th:href="@{/appointments}" class="btn-secondary text-xs">
            &larr; Back to Schedule
        </a>
    </div>

    <!-- Booking Form Card -->
    <div class="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200/80 shadow-xs">
        <form th:action="@{/appointments}" th:object="${appointmentRequest}" method="post" class="space-y-5">
            
            <!-- Global / Double-Booking Error Alert -->
            <div th:if="${bookingError != null}" 
                 class="p-4 bg-rose-50 border border-rose-200 text-rose-800 rounded-xl flex items-start gap-3 text-xs font-semibold">
                <svg class="w-5 h-5 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                <div th:text="${bookingError}">Double-booking conflict encountered.</div>
            </div>

            <!-- Patient Selection -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="patientId" class="text-xs font-bold text-slate-700 uppercase tracking-wider">
                        Patient <span class="text-rose-500">*</span>
                    </label>
                    <a th:href="@{/patients/new}" target="_blank" class="text-xs font-semibold text-teal-600 hover:text-teal-700 inline-flex items-center gap-1">
                        + New Patient?
                    </a>
                </div>
                <select id="patientId" th:field="*{patientId}" required
                        th:classappend="${#fields.hasErrors('patientId') ? 'border-rose-400 bg-rose-50/50' : 'border-slate-200 bg-slate-50'}"
                        class="w-full px-4 py-2.5 text-sm rounded-xl border focus:outline-none focus:border-teal-500 focus:bg-white transition-all">
                    <option value="">-- Choose Registered Patient --</option>
                    <option th:each="p : ${patients}" 
                            th:value="${p.id}" 
                            th:text="${p.fullName} + ' (' + ${p.contactNumber} + ')'"
                            th:selected="${p.id == appointmentRequest.patientId}">
                        John Doe (0771234567)
                    </option>
                </select>
                <p th:if="${#fields.hasErrors('patientId')}" th:errors="*{patientId}" class="text-xs text-rose-600 mt-1.5 font-medium"></p>
            </div>

            <!-- Dentist Selection -->
            <div>
                <label for="dentistId" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Dentist on Duty <span class="text-rose-500">*</span>
                </label>
                <select id="dentistId" th:field="*{dentistId}" required
                        th:classappend="${#fields.hasErrors('dentistId') ? 'border-rose-400 bg-rose-50/50' : 'border-slate-200 bg-slate-50'}"
                        class="w-full px-4 py-2.5 text-sm rounded-xl border focus:outline-none focus:border-teal-500 focus:bg-white transition-all">
                    <option value="">-- Select Dental Practitioner --</option>
                    <option th:each="d : ${dentists}" 
                            th:value="${d.id}" 
                            th:text="${d.fullName} + ' - ' + ${d.specialization}"
                            th:selected="${d.id == appointmentRequest.dentistId}">
                        Dr. Silva - Orthodontics
                    </option>
                </select>
                <p th:if="${#fields.hasErrors('dentistId')}" th:errors="*{dentistId}" class="text-xs text-rose-600 mt-1.5 font-medium"></p>
            </div>

            <!-- Treatment Type Selection -->
            <div>
                <label for="treatmentType" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Treatment Type & Tariffs <span class="text-rose-500">*</span>
                </label>
                <select id="treatmentType" th:field="*{treatmentType}" required
                        th:classappend="${#fields.hasErrors('treatmentType') ? 'border-rose-400 bg-rose-50/50' : 'border-slate-200 bg-slate-50'}"
                        class="w-full px-4 py-2.5 text-sm rounded-xl border focus:outline-none focus:border-teal-500 focus:bg-white transition-all">
                    <option value="">-- Select Treatment Procedure --</option>
                    <option th:each="t : ${treatmentTypes}" 
                            th:value="${t.name()}" 
                            th:text="${t.name()} + ' — Total: LKR ' + ${#numbers.formatDecimal(t.calculateTotalCost(), 1, 'COMMA', 2, 'POINT')} + ' (Base: ' + ${#numbers.formatDecimal(t.baseCost, 1, 'COMMA', 0, 'POINT')} + ' + Consultation: 500)'">
                        CLEANING — Total: LKR 3,500.00
                    </option>
                </select>
                <p th:if="${#fields.hasErrors('treatmentType')}" th:errors="*{treatmentType}" class="text-xs text-rose-600 mt-1.5 font-medium"></p>
            </div>

            <!-- Date & Time Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Appointment Date -->
                <div>
                    <label for="appointmentDate" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Appointment Date <span class="text-rose-500">*</span>
                    </label>
                    <input type="date" id="appointmentDate" th:field="*{appointmentDate}" required
                           th:min="${#temporals.format(today, 'yyyy-MM-dd')}"
                           th:classappend="${#fields.hasErrors('appointmentDate') ? 'border-rose-400 bg-rose-50/50' : 'border-slate-200 bg-slate-50'}"
                           class="w-full px-4 py-2.5 text-sm rounded-xl border focus:outline-none focus:border-teal-500 focus:bg-white transition-all font-mono">
                    <p th:if="${#fields.hasErrors('appointmentDate')}" th:errors="*{appointmentDate}" class="text-xs text-rose-600 mt-1.5 font-medium"></p>
                </div>

                <!-- Appointment Time -->
                <div>
                    <label for="appointmentTime" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Appointment Time <span class="text-rose-500">*</span>
                    </label>
                    <input type="time" id="appointmentTime" th:field="*{appointmentTime}" required
                           th:classappend="${#fields.hasErrors('appointmentTime') ? 'border-rose-400 bg-rose-50/50' : 'border-slate-200 bg-slate-50'}"
                           class="w-full px-4 py-2.5 text-sm rounded-xl border focus:outline-none focus:border-teal-500 focus:bg-white transition-all font-mono">
                    <p th:if="${#fields.hasErrors('appointmentTime')}" th:errors="*{appointmentTime}" class="text-xs text-rose-600 mt-1.5 font-medium"></p>
                </div>
            </div>

            <!-- Clinical Notes -->
            <div>
                <label for="notes" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Clinical Notes / Symptoms (Optional)
                </label>
                <textarea id="notes" th:field="*{notes}" rows="3" placeholder="e.g. Toothache on upper left molar, patient requests cleaning before whitening"
                          class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-teal-500 focus:bg-white transition-all"></textarea>
            </div>

            <!-- Actions Row -->
            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                <a th:href="@{/appointments}" class="btn-secondary text-xs">
                    Cancel
                </a>
                <button type="submit" class="btn-primary text-xs">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    <span>Confirm & Book Appointment</span>
                </button>
            </div>
        </form>
    </div>

</div>
</body>
</html>
