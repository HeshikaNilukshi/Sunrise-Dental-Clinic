<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="toast" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3 max-w-md w-full px-4 pointer-events-none">
    <!-- Success Flash Message -->
    <div th:if="${successMessage != null or param.success != null}" 
         class="toast-alert pointer-events-auto flex items-center justify-between gap-3 p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl shadow-lg transition-all duration-300">
        <div class="flex items-center gap-3">
            <div class="flex-shrink-0 w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <div>
                <p class="text-sm font-semibold text-emerald-900" th:text="${successMessage != null ? successMessage : (param.success != null ? param.success[0] : 'Action completed successfully')}">Success</p>
            </div>
        </div>
        <button onclick="dismissToast(this)" class="text-emerald-500 hover:text-emerald-700 p-1 rounded-lg">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <!-- Error Flash Message -->
    <div th:if="${errorMessage != null or param.error != null}" 
         class="toast-alert pointer-events-auto flex items-center justify-between gap-3 p-4 bg-rose-50 border border-rose-200 text-rose-800 rounded-xl shadow-lg transition-all duration-300">
        <div class="flex items-center gap-3">
            <div class="flex-shrink-0 w-8 h-8 rounded-full bg-rose-100 flex items-center justify-center text-rose-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </div>
            <div>
                <p class="text-sm font-semibold text-rose-900" th:text="${errorMessage != null ? errorMessage : (param.error != null ? param.error[0] : 'An error occurred')}">Error</p>
            </div>
        </div>
        <button onclick="dismissToast(this)" class="text-rose-500 hover:text-rose-700 p-1 rounded-lg">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <!-- Info Flash Message -->
    <div th:if="${infoMessage != null or param.info != null}" 
         class="toast-alert pointer-events-auto flex items-center justify-between gap-3 p-4 bg-sky-50 border border-sky-200 text-sky-800 rounded-xl shadow-lg transition-all duration-300">
        <div class="flex items-center gap-3">
            <div class="flex-shrink-0 w-8 h-8 rounded-full bg-sky-100 flex items-center justify-center text-sky-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <div>
                <p class="text-sm font-semibold text-sky-900" th:text="${infoMessage != null ? infoMessage : (param.info != null ? param.info[0] : 'Information notice')}">Info</p>
            </div>
        </div>
        <button onclick="dismissToast(this)" class="text-sky-500 hover:text-sky-700 p-1 rounded-lg">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>
</div>
</body>
</html>
