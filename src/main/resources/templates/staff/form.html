<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/_layout :: main('Register Staff', 'staff', ~{::div})}">
<div>
    <div class="max-w-2xl mx-auto">
        <div class="mb-6 flex items-center gap-4">
            <a th:href="@{/staff}" class="p-2 rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
            </a>
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Add New Staff</h1>
                <p class="text-sm text-slate-500 mt-1">Register a new system user for the clinic.</p>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/60 p-6 md:p-8">
            <div th:if="${errorMessage}" class="mb-6 p-4 rounded-xl bg-rose-50 border border-rose-100 flex items-start gap-3">
                <svg class="w-5 h-5 text-rose-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <div class="text-sm text-rose-700" th:text="${errorMessage}"></div>
            </div>

            <form th:action="@{/staff}" th:object="${registerRequest}" method="post" class="space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Full Name -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Full Name</label>
                        <input type="text" th:field="*{fullName}" 
                               class="w-full px-4 py-2.5 rounded-xl border bg-slate-50 border-slate-200 focus:bg-white focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10 transition-all outline-none"
                               th:classappend="${#fields.hasErrors('fullName')} ? 'border-rose-300 bg-rose-50/30' : ''"
                               placeholder="e.g. Jane Doe">
                        <p class="mt-1.5 text-xs text-rose-500 font-medium" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
                        <input type="email" th:field="*{email}" 
                               class="w-full px-4 py-2.5 rounded-xl border bg-slate-50 border-slate-200 focus:bg-white focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10 transition-all outline-none"
                               th:classappend="${#fields.hasErrors('email')} ? 'border-rose-300 bg-rose-50/30' : ''"
                               placeholder="jane@sunrisedental.com">
                        <p class="mt-1.5 text-xs text-rose-500 font-medium" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                        <input type="password" th:field="*{password}" 
                               class="w-full px-4 py-2.5 rounded-xl border bg-slate-50 border-slate-200 focus:bg-white focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10 transition-all outline-none"
                               th:classappend="${#fields.hasErrors('password')} ? 'border-rose-300 bg-rose-50/30' : ''"
                               placeholder="••••••••">
                        <p class="mt-1.5 text-xs text-rose-500 font-medium" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                    </div>

                    <!-- Confirm Password -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Confirm Password</label>
                        <input type="password" th:field="*{confirmPassword}" 
                               class="w-full px-4 py-2.5 rounded-xl border bg-slate-50 border-slate-200 focus:bg-white focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10 transition-all outline-none"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'border-rose-300 bg-rose-50/30' : ''"
                               placeholder="••••••••">
                        <p class="mt-1.5 text-xs text-rose-500 font-medium" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                    </div>
                </div>

                <div class="pt-6 border-t border-slate-100 flex gap-3">
                    <button type="submit" class="btn-primary flex-1 justify-center py-3">Register Staff</button>
                    <a th:href="@{/staff}" class="btn-secondary py-3 px-6">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</html>
