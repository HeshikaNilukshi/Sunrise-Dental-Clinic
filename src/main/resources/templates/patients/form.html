<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/_layout :: main('Register Patient', 'patients', ~{::content})}">
<head>
    <title>Register Patient</title>
</head>
<body>
<div th:fragment="content" class="max-w-2xl mx-auto space-y-6">

    <!-- Page Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-xl md:text-2xl font-bold text-slate-900">Register New Patient</h1>
            <p class="text-xs text-slate-500 mt-1">Add a new patient profile to Sunrise Dental Clinic system</p>
        </div>
        <a th:href="@{/patients}" class="btn-secondary text-xs">
            &larr; Back to Directory
        </a>
    </div>

    <!-- Registration Card Form -->
    <div class="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200/80 shadow-xs">
        <form th:action="@{/patients}" th:object="${patientRequest}" method="post" class="space-y-5">
            
            <!-- Full Name -->
            <div>
                <label for="fullName" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Full Name <span class="text-rose-500">*</span>
                </label>
                <input type="text" id="fullName" th:field="*{fullName}" placeholder="e.g. Johnathan Silva" required
                       th:classappend="${#fields.hasErrors('fullName') ? 'border-rose-400 bg-rose-50/50' : 'border-slate-200 bg-slate-50'}"
                       class="w-full px-4 py-2.5 text-sm rounded-xl border focus:outline-none focus:border-teal-500 focus:bg-white transition-all">
                <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-xs text-rose-600 mt-1.5 font-medium"></p>
            </div>

            <!-- Contact Number & Email Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Contact Number -->
                <div>
                    <label for="contactNumber" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Contact Number <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="contactNumber" th:field="*{contactNumber}" placeholder="e.g. 0771234567" required
                           th:classappend="${#fields.hasErrors('contactNumber') ? 'border-rose-400 bg-rose-50/50' : 'border-slate-200 bg-slate-50'}"
                           class="w-full px-4 py-2.5 text-sm rounded-xl border focus:outline-none focus:border-teal-500 focus:bg-white transition-all font-mono">
                    <p th:if="${#fields.hasErrors('contactNumber')}" th:errors="*{contactNumber}" class="text-xs text-rose-600 mt-1.5 font-medium"></p>
                    <p class="text-[11px] text-slate-400 mt-1">Must be unique for each patient.</p>
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Email Address
                    </label>
                    <input type="email" id="email" th:field="*{email}" placeholder="patient@example.com"
                           th:classappend="${#fields.hasErrors('email') ? 'border-rose-400 bg-rose-50/50' : 'border-slate-200 bg-slate-50'}"
                           class="w-full px-4 py-2.5 text-sm rounded-xl border focus:outline-none focus:border-teal-500 focus:bg-white transition-all">
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-xs text-rose-600 mt-1.5 font-medium"></p>
                    <p class="text-[11px] text-slate-400 mt-1">Used for booking & billing receipts.</p>
                </div>
            </div>

            <!-- Date of Birth -->
            <div>
                <label for="dateOfBirth" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Date of Birth <span class="text-rose-500">*</span>
                </label>
                <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" required
                       th:classappend="${#fields.hasErrors('dateOfBirth') ? 'border-rose-400 bg-rose-50/50' : 'border-slate-200 bg-slate-50'}"
                       class="w-full px-4 py-2.5 text-sm rounded-xl border focus:outline-none focus:border-teal-500 focus:bg-white transition-all">
                <p th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}" class="text-xs text-rose-600 mt-1.5 font-medium"></p>
            </div>

            <!-- Residential Address -->
            <div>
                <label for="address" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Residential Address <span class="text-rose-500">*</span>
                </label>
                <textarea id="address" th:field="*{address}" rows="3" placeholder="Street address, city, postal zone" required
                          th:classappend="${#fields.hasErrors('address') ? 'border-rose-400 bg-rose-50/50' : 'border-slate-200 bg-slate-50'}"
                          class="w-full px-4 py-2.5 text-sm rounded-xl border focus:outline-none focus:border-teal-500 focus:bg-white transition-all"></textarea>
                <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-xs text-rose-600 mt-1.5 font-medium"></p>
            </div>

            <!-- Actions Row -->
            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                <a th:href="@{/patients}" class="btn-secondary text-xs">
                    Cancel
                </a>
                <button type="submit" class="btn-primary text-xs">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    <span>Save & Register Patient</span>
                </button>
            </div>
        </form>
    </div>

</div>
</body>
</html>
